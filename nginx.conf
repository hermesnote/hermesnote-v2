server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # React Router（client-side routing）：找不到實際檔案就一律回 index.html，
    # 讓前端自己的路由接手，不要讓 nginx 對 /admin/xxx 這類路徑回 404。
    # /api 不會走到這裡——Nginx Proxy Manager 在更外層就直接轉給 backend:8000。
    location / {
        try_files $uri $uri/ /index.html;
    }
}
