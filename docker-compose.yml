services:
  frontend:
    container_name: hermesnote-frontend
    image: nginx:alpine
    restart: always
    ports:
      - "8082:80"
    volumes:
      - ./frontend/dist:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro

  backend:
    container_name: hermesnote-backend
    build:
      context: ./backend
    restart: always
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env

  training:
    container_name: hermesnote-training
    build:
      context: ./backend
      dockerfile: training/Dockerfile
    restart: always
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    env_file:
      - ./backend/.env
